# Carrier route reference: a small, hand-curated seed set of REAL, currently
# published named container-service rotations. This is illustrative, not an
# exhaustive model of global container shipping - add more services following
# the same shape. Every service below was fetched from the carrier's own
# published materials in September 2026; see each service's `source` field.
#
# ports:
#   Approximate port-city coordinates [lon, lat], looked up independently -
#   NOT sourced from PortWatch (most of these ports, e.g. Fos, Tanjung
#   Pelepas, Shanghai, don't resolve against the PortWatch `observation`
#   table the rest of this tool uses, so this file is self-contained).
#
# services[].calls:
#   The service's own published port-rotation ORDER, single pass (used for
#   "how many stops between A and B" / direct-vs-bus-stop comparisons).
#   `transship: true` means the vessel itself doesn't call there - cargo
#   reaches it via a feeder from the nearest preceding direct call, per the
#   carrier's own published network diagram. This is deliberately the
#   *simplified* rotation, not necessarily the exact physical port sequence -
#   see the note on transit_days below.
#
# services[].transit_days:
#   Real, carrier-published, non-contractual transit times in days, keyed
#   "From -> To" for whichever specific port pairs the carrier's own flyer
#   gives a number for. Only CMA CGM MEDEX publishes this (April 2026 flyer,
#   PDF, read directly). These are the carrier's own booking-tool numbers and
#   are NOT required to arithmetically reconcile with the simplified `calls`
#   rotation order above - CMA CGM's flyer shows MEDEX as a pendulum/butterfly
#   string that calls some ports (Djibouti, Jeddah) more than once per loop,
#   which the simplified single-pass `calls` list above does not attempt to
#   reconstruct. Where the flyer's own matrix distinguished two visits to the
#   same port ("Djibouti (2nd pass)") we kept only the first, lower figure -
#   the second can't be represented as a distinct dict key without a fake
#   port name, and inventing one felt worse than dropping one data point.
#   Services with no published matrix (Maersk AE-series, CMA CGM BIGEX 1) get
#   an empty transit_days - never a guessed number at this data layer. A
#   distance/speed ESTIMATE is computed downstream (analytics/carrier_routes.py)
#   only when nothing published is available, and is always labeled as such.

