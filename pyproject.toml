[project]
name = "logjam"
version = "0.1.0"
description = "Detect where maritime trade flow is blocked and where it reroutes, from free public data (IMF PortWatch, with a live-AIS queue adapter)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Michael Schertz", email = "michael.schertz@gmail.com" }]
keywords = ["logistics", "supply-chain", "ports", "ais", "congestion", "osint"]

dependencies = [
    "httpx>=0.27",
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rich>=13.7",
    "websockets>=13.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.36", "pydeck>=0.9"]
api = ["fastapi>=0.111", "uvicorn>=0.30"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "respx>=0.21"]

[project.scripts]
logjam = "logjam.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logjam"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Report generators and the PDF builder embed long prose / CSS / HTML strings;
# hard-wrapping them to the column limit hurts readability more than it helps.
"scripts/reports/*.py" = ["E501"]
"scripts/build_pdfs.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
