[project]
name = "bottleneck-logistics"
version = "0.1.0"
description = "Open-source logistics / supply-chain bottleneck and opportunity identifier"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Schertz", email = "michael.schertz@gmail.com" }]
keywords = ["logistics", "supply-chain", "ports", "ais", "congestion", "osint"]

dependencies = [
    "httpx>=0.27",
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rich>=13.7",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.36", "pydeck>=0.9"]
api = ["fastapi>=0.111", "uvicorn>=0.30"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "respx>=0.21"]

[project.scripts]
bottleneck = "bottleneck_logistics.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bottleneck_logistics"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
